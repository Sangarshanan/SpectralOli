<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spectral Livecoder</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background: #0d0d0d; color: #ccc; font-family: 'Courier New', monospace;
            display: flex; flex-direction: column; align-items: center;
            padding: 1.5rem; margin: 0; gap: 5px;
        }
        .top-bar {
            display: flex; gap: 8px; width: 820px; align-items: center;
        }
        .code-bar {
            display: flex; gap: 8px; width: 820px; align-items: center;
        }
        input[type="text"] {
            flex-grow: 1; background: #111; color: #00ff88;
            border: 1px solid #2a2a2a; padding: 8px 12px;
            font-family: 'Courier New', monospace; font-size: 1rem; outline: none;
        }
        input[type="text"]:focus { border-color: #00ff88; }
        button {
            padding: 7px 18px; cursor: pointer; background: #151515;
            color: #ccc; border: 1px solid #333; font-family: monospace;
            white-space: nowrap;
        }
        button:not(:disabled):hover { border-color: #777; color: #fff; }
        button:disabled { opacity: 0.35; cursor: not-allowed; }
        select {
            background: #151515; color: #ccc; border: 1px solid #333;
            padding: 7px 10px; font-family: monospace; cursor: pointer;
        }
        canvas { display: block; }
        #waveform  { border: 1px solid #1e1e1e; cursor: default; }
        .spectrogram-stack {
            position: relative; width: 820px; height: 600px;
        }
        .spectrogram-stack > * {
            position: absolute; top: 0; left: 0; display: block;
        }
        #spectrogramPre  { border: 1px solid #1e1e1e; }
        #spectrogramPost { mix-blend-mode: screen; }
        #overlaysvg      { overflow: visible; }
        .dim { font-size: 0.72rem; color: #444; white-space: nowrap; }
        .spacer { flex: 1; }
    </style>
</head>
<body>
    <div class="top-bar">
        <button id="playBtn" disabled>▶ Play</button>
        <span class="dim">palette:</span>
        <select id="paletteSelect">
            <option value="matrix">Matrix</option>
            <option value="heatmap" selected>Heatmap</option>
            <option value="ocean">Ocean</option>
            <option value="plasma">Plasma</option>
            <option value="inferno">Inferno</option>
        </select>
        <span class="spacer"></span>
        <span id="statusText" class="dim">loading…</span>
    </div>

    <canvas id="waveform" width="820" height="72"></canvas>

    <div class="code-bar">
        <span class="dim">&gt;</span>
        <input type="text" id="codeInput" value="" placeholder="band(200,4000)" autocomplete="off" spellcheck="false" />
        <span class="dim" id="codeHint">ctrl+enter to apply &middot; dsl or raw js</span>
    </div>

    <div class="spectrogram-stack">
        <canvas id="spectrogramPre"  width="820" height="600"></canvas>
        <canvas id="spectrogramPost" width="820" height="600"></canvas>
        <svg    id="overlaysvg"      width="820" height="600"></svg>
    </div>

    <script type="module" src="./main.js"></script>
</body>
</html>
