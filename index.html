<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpectralOli</title>
    <meta name="description" content="Real-time browser-based spectral livecoding interface with multi-loop support, spectrogram visualization, and DSL-driven audio manipulation.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #0a0a0a;
            color: #c8c8c8;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ─── Toolbar ─────────────────────────────────────────────── */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 960px;
            padding: 12px 16px;
            border-bottom: 1px solid #1a1a1a;
        }

        .toolbar button {
            padding: 7px 18px;
            cursor: pointer;
            background: #151515;
            color: #c8c8c8;
            border: 1px solid #2a2a2a;
            font-family: inherit;
            font-size: 0.82rem;
            white-space: nowrap;
            border-radius: 4px;
            transition: all 0.15s ease;
        }
        .toolbar button:hover {
            border-color: #00ff88;
            color: #fff;
            background: #111;
        }
        .toolbar button.active {
            border-color: #ff4466;
            color: #ff4466;
        }

        .toolbar select {
            background: #131313;
            color: #c8c8c8;
            border: 1px solid #2a2a2a;
            padding: 7px 10px;
            font-family: inherit;
            font-size: 0.78rem;
            cursor: pointer;
            border-radius: 4px;
        }

        .toolbar .spacer { flex: 1; }
        .toolbar .dim { font-size: 0.72rem; color: #444; white-space: nowrap; }

        .btn-freesound {
            padding: 7px 12px;
            background: #101615;
            border: 1px solid #1e3a33;
            color: #7ef7c2;
            font-size: 0.75rem;
        }
        .btn-freesound:hover {
            border-color: #2bdca0;
            color: #d7ffef;
            background: #0c1312;
        }

        /* ─── Drop Zone ───────────────────────────────────────────── */
        .drop-zone {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 6px 18px;
            border: 1.5px dashed #2a2a2a;
            border-radius: 6px;
            font-size: 0.72rem;
            color: #555;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            min-width: 200px;
        }
        .drop-zone:hover,
        .drop-zone.dragover {
            border-color: #00ff88;
            color: #00ff88;
            background: rgba(0, 255, 136, 0.04);
        }
        .drop-zone .drop-icon {
            font-size: 1rem;
        }

        /* ─── Master Spectrogram ──────────────────────────────────── */
        .master-section {
            width: 100%;
            max-width: 960px;
            padding: 10px 16px 6px;
        }
        .master-label {
            font-size: 0.65rem;
            color: #333;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .master-spectrogram-stack {
            position: relative;
            width: 100%;
            height: 220px;
            border: 1px solid #1a1a1a;
            border-radius: 4px;
            overflow: hidden;
        }
        .master-spectrogram-stack > canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        /* ─── Track Navigator ─────────────────────────────────────── */
        .track-navigator {
            width: 100%;
            max-width: 960px;
            padding: 6px 16px;
            display: flex;
            align-items: center;
            gap: 6px;
            overflow-x: auto;
            overflow-y: hidden;
            position: sticky;
            top: 0;
            z-index: 10;
            background: #0a0a0a;
            border-bottom: 1px solid #141414;
            scrollbar-width: thin;
        }
        .track-navigator::-webkit-scrollbar { height: 3px; }
        .track-navigator::-webkit-scrollbar-thumb { background: #222; border-radius: 2px; }

        .nav-label {
            font-size: 0.6rem;
            color: #333;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .nav-pill {
            padding: 3px 10px;
            font-size: 0.68rem;
            font-family: inherit;
            background: #141414;
            color: #666;
            border: 1px solid #1e1e1e;
            border-radius: 12px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s ease;
            flex-shrink: 0;
        }
        .nav-pill:hover {
            border-color: #444;
            color: #bbb;
        }
        .nav-pill.active {
            border-color: #00ff88;
            color: #00ff88;
            background: rgba(0, 255, 136, 0.06);
        }
        .nav-pill.master::before {
            content: '👑 ';
        }
        .nav-pill.muted {
            opacity: 0.35;
        }

        .nav-count {
            font-size: 0.6rem;
            color: #333;
            white-space: nowrap;
            flex-shrink: 0;
            margin-left: auto;
        }

        /* ─── Track Lanes Container ───────────────────────────────── */
        .track-lanes {
            width: 100%;
            max-width: 960px;
            padding: 0 16px 24px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        /* ─── Single Track Lane ───────────────────────────────────── */
        .track-lane {
            display: grid;
            grid-template-columns: 200px 1fr 1fr;
            gap: 8px;
            padding: 10px 12px;
            background: #0e0e0e;
            border: 1px solid #181818;
            border-radius: 5px;
            position: relative;
            transition: all 0.2s ease;
            overflow: hidden;
        }
        .track-lane:hover {
            border-color: #222;
        }
        .track-lane.collapsed {
            grid-template-columns: 1fr;
            gap: 0;
            padding: 6px 12px;
        }
        .track-lane.collapsed .track-spectrogram-stack,
        .track-lane.collapsed .track-code-wrap,
        .track-lane.collapsed .track-waveform,
        .track-lane.collapsed .track-buttons {
            display: none;
        }
        .track-lane.collapsed .track-controls {
            flex-direction: row;
            align-items: center;
            gap: 8px;
        }
        .track-lane.highlight,
        .track-lane.active-lane {
            border-color: #00ff88;
        }

        /* ── Controls Column ── */
        .track-controls {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
        }

        .track-header {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .track-name {
            flex: 1;
            background: transparent;
            border: 1px solid transparent;
            color: #ddd;
            font-family: inherit;
            font-size: 0.78rem;
            font-weight: 500;
            padding: 2px 5px;
            border-radius: 3px;
            outline: none;
            min-width: 0;
            transition: all 0.15s ease;
        }
        .track-name:hover { border-color: #2a2a2a; }
        .track-name:focus {
            border-color: #00ff88;
            background: #111;
            color: #fff;
        }

        .btn-action {
            background: transparent;
            border: none;
            color: #444;
            font-size: 0.85rem;
            cursor: pointer;
            padding: 0 3px;
            line-height: 1;
            transition: color 0.15s ease;
            font-family: inherit;
        }
        .btn-action:hover { color: #888; }
        .btn-action.btn-remove:hover { color: #ff4466; }
        .btn-action.btn-duplicate:hover { color: #00e5ff; }
        .btn-action.btn-collapse:hover { color: #00ff88; }
        
        .btn-master {
            background: transparent;
            border: none;
            color: #444;
            font-size: 0.85rem;
            cursor: pointer;
            padding: 0 3px;
            line-height: 1;
            transition: all 0.15s ease;
            filter: grayscale(1);
            opacity: 0.5;
        }
        .btn-master:hover { filter: grayscale(0.5); opacity: 0.8; }
        .btn-master.is-master { filter: grayscale(0); opacity: 1; cursor: default; }

        .btn-collapse-icon {
            display: inline-block;
            transition: transform 0.2s ease;
            font-size: 0.7rem;
        }
        .track-lane.collapsed .btn-collapse-icon {
            transform: rotate(-90deg);
        }

        .track-buttons {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-mute, .btn-solo {
            width: 26px;
            height: 22px;
            font-size: 0.68rem;
            font-weight: 700;
            font-family: inherit;
            background: #181818;
            border: 1px solid #2a2a2a;
            color: #555;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.12s ease;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-mute.active {
            background: #441111;
            border-color: #ff4466;
            color: #ff4466;
        }
        .btn-solo.active {
            background: #113311;
            border-color: #00ff88;
            color: #00ff88;
        }

        .track-volume {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            background: #222;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
            max-width: 90px;
        }
        .track-volume::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px; height: 10px;
            background: #888;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.1s;
        }
        .track-volume::-webkit-slider-thumb:hover { background: #00ff88; }

        .track-waveform {
            width: 100%;
            height: 46px;
            display: block;
            border-radius: 3px;
            cursor: default;
        }

        /* ── Spectrogram Column ── */
        .track-spectrogram-stack {
            position: relative;
            min-height: 160px;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #1a1a1a;
        }
        .track-spectrogram-stack > * {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
        .track-spec-post { mix-blend-mode: screen; }
        .track-overlay { overflow: visible; }

        /* ── Code Column ── */
        .track-code-wrap {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .track-code {
            flex: 1;
            background: #0c0c0c;
            color: #00ff88;
            border: 1px solid #1e1e1e;
            padding: 8px 10px;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 0.78rem;
            line-height: 1.5;
            resize: none;
            outline: none;
            border-radius: 4px;
            transition: border-color 0.15s ease;
            min-height: 80px;
        }
        .track-code:focus { border-color: #00ff88; }
        .track-code::placeholder { color: #2a3a2e; }

        .code-hint {
            font-size: 0.62rem;
            color: #333;
            text-align: right;
            padding-right: 4px;
        }

        .code-error {
            font-size: 0.62rem;
            color: #ff4466;
            padding: 3px 6px;
            border-left: 2px solid #ff4466;
            background: rgba(255, 68, 102, 0.06);
            border-radius: 0 3px 3px 0;
            white-space: pre-wrap;
            display: none;
        }
        .code-error.visible { display: block; }

        /* ─── Add Track Button ────────────────────────────────────── */
        .add-track-hint {
            text-align: center;
            padding: 16px;
            font-size: 0.7rem;
            color: #2a2a2a;
        }

        /* ─── Clock Bar ───────────────────────────────────────────── */
        .clock-bar-container {
            width: 100%;
            max-width: 960px;
            height: 3px;
            background: #111;
            margin: 0 0 2px;
        }
        .clock-bar-fill {
            height: 100%;
            width: 0%;
            background: #00ff88;
            border-radius: 0 2px 2px 0;
        }

        /* ─── Number inputs (BPM / beats) ────────────────────────── */
        .toolbar input[type="number"] {
            width: 52px;
            background: #131313;
            color: #c8c8c8;
            border: 1px solid #2a2a2a;
            padding: 6px 6px;
            font-family: inherit;
            font-size: 0.78rem;
            border-radius: 4px;
            text-align: center;
            -moz-appearance: textfield;
            appearance: textfield;
        }
        .toolbar input[type="number"]::-webkit-inner-spin-button,
        .toolbar input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
        .toolbar input[type="number"]:focus {
            outline: none;
            border-color: #00ff88;
            color: #fff;
        }

        /* ─── Freesound Modal ────────────────────────────────────── */
        .fs-modal {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(2px);
            z-index: 50;
            padding: 18px;
        }
        .fs-modal.open { display: flex; }
        .fs-panel {
            width: min(980px, 100%);
            max-height: 85vh;
            overflow: hidden;
            border: 1px solid #22342e;
            border-radius: 8px;
            background: #0c1010;
            display: flex;
            flex-direction: column;
        }
        .fs-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            border-bottom: 1px solid #1a2422;
        }
        .fs-title {
            font-size: 0.78rem;
            color: #9af5ce;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .fs-close {
            border: 1px solid #2a2a2a;
            background: #121212;
            color: #aaa;
            border-radius: 4px;
            padding: 4px 8px;
            cursor: pointer;
            font-family: inherit;
        }
        .fs-close:hover {
            border-color: #00ff88;
            color: #fff;
        }
        .fs-controls {
            display: grid;
            grid-template-columns: 1.5fr 0.8fr 0.8fr 0.9fr 1fr auto;
            gap: 8px;
            padding: 12px 14px;
            border-bottom: 1px solid #141d1b;
        }
        .fs-controls input,
        .fs-controls select {
            width: 100%;
            background: #111616;
            color: #d4dfdc;
            border: 1px solid #26322f;
            padding: 7px 9px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.74rem;
        }
        .fs-controls input:focus,
        .fs-controls select:focus {
            outline: none;
            border-color: #00ff88;
        }
        .fs-search-btn {
            border: 1px solid #1d4f3f;
            background: #0e1b18;
            color: #8dffd2;
            padding: 7px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.74rem;
            white-space: nowrap;
        }
        .fs-search-btn:hover { border-color: #2edca3; color: #fff; }
        .fs-status {
            padding: 8px 14px;
            font-size: 0.68rem;
            color: #567067;
            border-bottom: 1px solid #141d1b;
            min-height: 28px;
        }
        .fs-results {
            overflow: auto;
            padding: 8px 14px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .fs-item {
            border: 1px solid #1d2b27;
            border-radius: 6px;
            padding: 10px;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            align-items: center;
            background: #0e1413;
        }
        .fs-meta {
            font-size: 0.7rem;
            color: #87a49b;
            margin-top: 4px;
        }
        .fs-load-btn {
            border: 1px solid #2a3f39;
            background: #111a18;
            color: #a5ffdb;
            border-radius: 4px;
            padding: 6px 10px;
            font-family: inherit;
            font-size: 0.72rem;
            cursor: pointer;
        }
        .fs-load-btn:hover { border-color: #30e7ac; color: #fff; }
        .fs-preview-btn {
            border: 1px solid #33413d;
            background: #141b1a;
            color: #c0d3cc;
            border-radius: 4px;
            padding: 6px 10px;
            font-family: inherit;
            font-size: 0.72rem;
            cursor: pointer;
        }
        .fs-preview-btn:hover { border-color: #7ca897; color: #fff; }
        .fs-preview-btn.playing {
            border-color: #ff7d8f;
            color: #ffb3bd;
            background: #241416;
        }
        .fs-actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .fs-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border-top: 1px solid #17221f;
            background: #0b1110;
        }
        .fs-page-info {
            font-size: 0.72rem;
            color: #6e8c83;
        }
        .fs-page-controls {
            display: flex;
            gap: 8px;
        }
        .fs-page-btn {
            border: 1px solid #2b3a36;
            background: #121917;
            color: #bdd4cc;
            border-radius: 4px;
            padding: 6px 10px;
            font-family: inherit;
            font-size: 0.72rem;
            cursor: pointer;
        }
        .fs-page-btn:hover { border-color: #00ff88; color: #fff; }
        .fs-page-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        @media (max-width: 820px) {
            .fs-controls {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* ─── Hidden file input ───────────────────────────────────── */
        #fileInput { display: none; }

        /* ─── Canvas defaults ─────────────────────────────────────── */
        canvas { image-rendering: pixelated; }

        /* ─── Scrollbar styling ───────────────────────────────────── */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #222; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #333; }
    </style>
</head>
<body>
    <!-- Toolbar -->
    <div class="toolbar" id="toolbar">
        <button id="playBtn" disabled>▶ Play All</button>
        <span class="dim">bpm:</span>
        <input type="number" id="bpmInput" value="120" min="1" max="999" step="1" />
        <span class="dim">beats:</span>
        <input type="number" id="beatsInput" value="4" min="1" max="64" step="1" />
        <span class="dim">palette:</span>
        <select id="paletteSelect">
            <option value="matrix">Matrix</option>
            <option value="heatmap" selected>Heatmap</option>
            <option value="ocean">Ocean</option>
            <option value="plasma">Plasma</option>
            <option value="inferno">Inferno</option>
        </select>
        <button id="queryFreesoundBtn" class="btn-freesound">Query Freesound</button>
        <div class="spacer"></div>
        <div class="drop-zone" id="dropZone">
            <span class="drop-icon">+</span>
            <span>Drop audio or click to browse</span>
        </div>
        <input type="file" id="fileInput" accept="audio/*" multiple />
        <span id="statusText" class="dim">loading…</span>
    </div>

    <!-- Global Clock Bar -->
    <div class="clock-bar-container">
        <div id="global-clock-fill" class="clock-bar-fill"></div>
    </div>

    <!-- Master Spectrogram -->
    <div class="master-section">
        <div class="master-label">master output</div>
        <div class="master-spectrogram-stack" id="masterStack">
            <canvas id="masterCanvas"></canvas>
        </div>
    </div>

    <!-- Track Navigator -->
    <div class="track-navigator" id="trackNavigator">
        <span class="nav-label">tracks</span>
        <span class="nav-count" id="navCount"></span>
    </div>

    <!-- Track Lanes -->
    <div class="track-lanes" id="trackLanes">
    </div>

    <!-- Freesound Modal -->
    <div id="freesoundModal" class="fs-modal" aria-hidden="true">
        <div class="fs-panel" role="dialog" aria-modal="true" aria-label="Freesound Search">
            <div class="fs-header">
                <div class="fs-title">Freesound Query</div>
                <button id="freesoundCloseBtn" class="fs-close">Close</button>
            </div>
            <div class="fs-controls">
                <input id="fsQueryInput" type="text" placeholder="Search loops, drums, texture..." />
                <input id="fsTagInput" type="text" placeholder="tag (optional)" />
                <input id="fsDurationMin" type="number" min="0" step="0.1" placeholder="min sec" />
                <input id="fsDurationMax" type="number" min="0" step="0.1" placeholder="max sec" />
                <select id="fsSortSelect">
                    <option value="score">Relevance</option>
                    <option value="rating_desc">Rating</option>
                    <option value="downloads_desc">Downloads</option>
                    <option value="duration_asc">Duration Asc</option>
                    <option value="duration_desc">Duration Desc</option>
                </select>
                <button id="fsSearchBtn" class="fs-search-btn">Search</button>
            </div>
            <div id="fsStatus" class="fs-status">Enter query and search.</div>
            <div id="fsResults" class="fs-results"></div>
            <div class="fs-footer">
                <div id="fsPageInfo" class="fs-page-info">Page 1</div>
                <div class="fs-page-controls">
                    <button id="fsPrevBtn" class="fs-page-btn" disabled>Prev</button>
                    <button id="fsNextBtn" class="fs-page-btn" disabled>Next</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
