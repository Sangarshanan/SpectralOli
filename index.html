<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpectralOli</title>
    <meta name="description"
        content="Real-time browser-based spectral livecoding interface with multi-loop support, spectrogram visualization, and DSL-driven audio manipulation.">
    <link rel="icon" type="image/png" href="media/soli-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles/main.css">
</head>

<body>
    <div class="scrollable-content">
        <!-- Toolbar -->
        <div class="toolbar" id="toolbar">
            <button id="playBtn" disabled>▶ Play All</button>
            <span class="dim">bpm:</span>
            <input type="number" id="bpmInput" value="80" min="1" max="999" step="1" />
            <span class="dim">beats:</span>
            <input type="number" id="beatsInput" value="4" min="1" max="16" step="1" />
            <span class="dim">palette:</span>
            <select id="paletteSelect">
                <option value="matrix">Matrix</option>
                <option value="ocean">Ocean</option>
                <option value="plasma">Plasma</option>
                <option value="inferno">Inferno</option>
            </select>
            <div class="spacer"></div>
            <div class="toolbar-add-audio">
                <a href="./getting-started.html" class="toolbar-link">Learn</a>
                <button id="queryFreesoundBtn" class="btn-freesound">Query Freesound</button>
                <div class="drop-zone" id="dropZone">
                    <span class="drop-icon">+</span>
                    <span>Upload audio</span>
                </div>
                <button id="themeToggleBtn" title="Switch to light mode">☀️</button>
            </div>
            <input type="file" id="fileInput" accept="audio/*" multiple />
        </div>

        <!-- Global Clock Bar -->
        <div class="clock-bar-container">
            <div id="global-clock-fill" class="clock-bar-fill"></div>
        </div>

        <!-- Master Spectrogram -->
        <div class="master-section">
            <div class="master-label">master output</div>
            <div class="master-spectrogram-stack" id="masterStack">
                <canvas id="masterCanvas"></canvas>
            </div>
        </div>

        <!-- Track Navigator -->
        <div class="track-navigator" id="trackNavigator">
            <span class="nav-label">tracks</span>
            <span class="nav-count" id="navCount"></span>
        </div>

        <!-- Track Lanes -->
        <div class="track-lanes" id="trackLanes">
        </div>
    </div> <!-- End scrollable-content -->

    <!-- Freesound Modal -->
    <div id="freesoundModal" class="fs-modal" aria-hidden="true">
        <div class="fs-panel" role="dialog" aria-modal="true" aria-label="Freesound Search">
            <div class="fs-header">
                <div class="fs-title">Freesound Query</div>
                <button id="freesoundCloseBtn" class="fs-close">Close</button>
            </div>
            <div class="fs-controls">
                <div class="fs-query-row">
                    <input id="fsQueryInput" type="text" placeholder="Eat some loops today..."
                        aria-label="Search query" />
                    <select id="fsSortSelect" aria-label="Sort by">
                        <option value="score">Relevance</option>
                        <option value="rating_desc">Rating</option>
                        <option value="downloads_desc">Downloads</option>
                        <option value="duration_asc">Duration Asc</option>
                        <option value="duration_desc">Duration Desc</option>
                    </select>
                    <button id="fsSearchBtn" class="fs-search-btn">Search</button>
                </div>
                <div class="fs-filters-row">
                    <div class="fs-filter-group">
                        <span class="fs-filter-label">Duration (sec)</span>
                        <div class="fs-filter-inputs">
                            <input id="fsDurationMin" type="number" min="0" step="0.1" placeholder="Min"
                                title="Minimum duration in seconds" aria-label="Minimum duration in seconds" />
                            <span class="fs-filter-sep">to</span>
                            <input id="fsDurationMax" type="number" min="0" step="0.1" placeholder="Max"
                                title="Maximum duration in seconds" aria-label="Maximum duration in seconds" />
                            <span class="fs-filter-unit">s</span>
                        </div>
                    </div>
                    <div class="fs-filter-group">
                        <span class="fs-filter-label">Tempo (BPM)</span>
                        <div class="fs-filter-inputs">
                            <input id="fsBpmMin" type="number" min="1" step="1" placeholder="Min" title="Minimum BPM"
                                aria-label="Minimum BPM" />
                            <span class="fs-filter-sep">to</span>
                            <input id="fsBpmMax" type="number" min="1" step="1" placeholder="Max" title="Maximum BPM"
                                aria-label="Maximum BPM" />
                            <span class="fs-filter-unit">bpm</span>
                        </div>
                    </div>
                </div>
            </div>
            <div id="fsStatus" class="fs-status">Enter query and search.</div>
            <div id="fsResults" class="fs-results"></div>
            <div class="fs-footer">
                <div id="fsPageInfo" class="fs-page-info">Page 1</div>
                <div class="fs-page-controls">
                    <button id="fsPrevBtn" class="fs-page-btn" disabled>Prev</button>
                    <button id="fsNextBtn" class="fs-page-btn" disabled>Next</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="./src/main.js"></script>
</body>

</html>
